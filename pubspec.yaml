name: porcelain_photo_booth
description: "Porcelain Photo Booth: offline-first iPadOS and Android tablet photo booth."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  # Validated toolchain pin (ADR-0001). Upgrading Flutter is a deliberate change:
  # update this, pubspec.lock, CI and docs/TOOLCHAIN_INVENTORY.md together.
  flutter: 3.47.7

dependencies:
  audioplayers: 6.8.1
  camera: ^0.12.1
  collection: ^1.19.1
  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  material_symbols_icons: ^4.2960.0
  meta: ^1.17.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.0
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  # Bundled, licensed fonts (AC-0211, docs/ASSET_PROVENANCE.md). Static
  # instances with explicit weights, so text renders identically everywhere.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/cormorant_garamond/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/cormorant_garamond/CormorantGaramond-SemiBold.ttf
          weight: 600
    # Guest experience faces (EP02; licences: docs/ASSET_PROVENANCE.md).
    # Fredoka and Pixelify Sans are variable fonts: weight comes from the
    # wght axis (GuestFonts.style).
    - family: Courier Prime
      fonts:
        - asset: assets/fonts/courier_prime/CourierPrime-Regular.ttf
          weight: 400
        - asset: assets/fonts/courier_prime/CourierPrime-Bold.ttf
          weight: 700
    - family: Monoton
      fonts:
        - asset: assets/fonts/monoton/Monoton-Regular.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-Variable.ttf
    - family: Poiret One
      fonts:
        - asset: assets/fonts/poiret_one/PoiretOne-Regular.ttf
    - family: Pixelify Sans
      fonts:
        - asset: assets/fonts/pixelify_sans/PixelifySans-Variable.ttf

  assets:
    # Font licence texts, registered with the app's licence page.
    - assets/fonts/inter/OFL.txt
    - assets/fonts/cormorant_garamond/OFL.txt
    - assets/fonts/courier_prime/OFL.txt
    - assets/fonts/monoton/OFL.txt
    - assets/fonts/fredoka/OFL.txt
    - assets/fonts/poiret_one/OFL.txt
    - assets/fonts/pixelify_sans/OFL.txt
    # Guest sounds (EP03): generated placeholders until the owner's
    # recordings replace them (docs/experience_packs/SOUND_SCRIPT_ELEVENLABS.md).
    - assets/sounds/
    # The app's own template decorations, drawn by tool/art/decorations.dart
    # (docs/ASSET_PROVENANCE.md).
    - assets/decorations/
