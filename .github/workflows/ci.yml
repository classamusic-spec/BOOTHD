# Static checks, unit/widget tests, the phone-delivery backend's checks and
# an Android smoke build on every push to main or claude/** and on pull
# requests. The iPadOS build runs on a macOS
# runner only when started by hand (Actions > CI > Run workflow > ios: true),
# because macOS minutes are expensive and no signing is configured yet.
# None of these jobs is physical-device evidence (TEST_AND_DEVICE_PLAN T-03).
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Also build iPadOS (unsigned) on a macOS runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with environment.flutter in pubspec.yaml (ADR-0001).
  FLUTTER_VERSION: 3.47.7
  # The phone-delivery backend's runtime for tests (ADR-0015).
  DENO_VERSION: v2.9.6

jobs:
  checks:
    name: Format, analyze, test, licences
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: tool/check.sh

  backend:
    name: Delivery backend (Deno, Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: backend/tool/test.sh
        env:
          DELIVERY_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres

  android:
    name: Android release smoke build
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: tool/build_android.sh release

  ios:
    name: iPadOS unsigned build
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: tool/build_ios.sh release
