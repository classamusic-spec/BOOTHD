include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated by drift_dev from the schema dumps.
    - test/drift/**/generated/**
    - web/**

linter:
  rules:
    # Async correctness matters for serialised camera and file operations.
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_dynamic_calls
    - only_throw_errors
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - directives_ordering
